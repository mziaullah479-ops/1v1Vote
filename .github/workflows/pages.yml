name: Build and deploy 1v1Vote preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: VITE_BASE_PATH=/1v1Vote/ npm run build
      - name: Smoke-test backend bundle
        run: |
          export PORT=4175 NODE_ENV=production DATA_DIR="$RUNNER_TEMP/1v1vote-data" ADMIN_PASSWORD="ci-test-password"
          node dist/server.cjs > "$RUNNER_TEMP/1v1vote-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4175/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent -c "$RUNNER_TEMP/user-cookies.txt" \
            -H 'content-type: application/json' \
            -d '{"name":"CI Tester","email":"ci@example.com","password":"ci-test-password"}' \
            http://127.0.0.1:4175/api/auth/register > /dev/null
          curl --fail --silent -b "$RUNNER_TEMP/user-cookies.txt" \
            http://127.0.0.1:4175/api/matches > "$RUNNER_TEMP/matches.json"
          match_id=$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/matches.json')).matches[0].id")
          creator_id=$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/matches.json')).matches[0].creator1.id")
          curl --fail --silent -b "$RUNNER_TEMP/user-cookies.txt" \
            -H 'content-type: application/json' \
            -d "{\"creatorId\":\"$creator_id\"}" \
            "http://127.0.0.1:4175/api/matches/$match_id/vote" > /dev/null
          duplicate_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -b "$RUNNER_TEMP/user-cookies.txt" \
            -H 'content-type: application/json' \
            -d "{\"creatorId\":\"$creator_id\"}" \
            "http://127.0.0.1:4175/api/matches/$match_id/vote")
          test "$duplicate_status" = "409"
          curl --fail --silent -c "$RUNNER_TEMP/admin-cookies.txt" \
            -H 'content-type: application/json' \
            -d '{"password":"ci-test-password"}' \
            http://127.0.0.1:4175/api/admin/login > /dev/null
          curl --fail --silent -b "$RUNNER_TEMP/admin-cookies.txt" \
            -X POST http://127.0.0.1:4175/api/admin/backup > /dev/null
          kill "$server_pid"
          wait "$server_pid" || true
      - name: Preserve SPA routes
        run: cp dist/index.html dist/404.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
