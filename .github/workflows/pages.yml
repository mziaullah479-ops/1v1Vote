name: Build and deploy 1v1Vote preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: VITE_BASE_PATH=/1v1Vote/ VITE_BACKEND_URL=https://1v1vote.com npm run build
      - name: Smoke-test backend bundle
        run: |
          set -euxo pipefail
          export PORT=4175 NODE_ENV=production DATA_DIR="$RUNNER_TEMP/1v1vote-data" ADMIN_PASSWORD="ci-test-password"
          node .server/server.cjs > "$RUNNER_TEMP/1v1vote-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --show-error --silent http://127.0.0.1:4175/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --show-error --silent http://127.0.0.1:4175/api/health > /dev/null
          curl --fail --show-error --silent http://127.0.0.1:4175/api/people > /dev/null
          curl --fail --show-error --silent -c "$RUNNER_TEMP/admin-cookies.txt" \
            -H 'content-type: application/json' \
            -d '{"password":"ci-test-password"}' \
            http://127.0.0.1:4175/api/admin/login > /dev/null
          csrf_token=$(node -e "const line=require('fs').readFileSync(process.env.RUNNER_TEMP + '/admin-cookies.txt','utf8').split('\\n').find((value)=>value.includes('v1_admin_csrf')); console.log(line ? line.split('\\t').at(-1) : '')")
          curl --fail --show-error --silent -b "$RUNNER_TEMP/admin-cookies.txt" \
            -H "X-CSRF-Token: $csrf_token" \
            -X POST http://127.0.0.1:4175/api/admin/backup > /dev/null
          kill "$server_pid"
          wait "$server_pid" || true
      - name: Preserve SPA routes
        run: cp dist/index.html dist/404.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
